<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lirik Lagu Berjalan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="lyrics-container">
        {% for line in lyrics %}
            <p class="lyric-line">{{ line }}</p>
        {% endfor %}
    </div>

    <script>
        const lines = document.querySelectorAll('.lyric-line');
        let index = 0;

        function highlightNextLine() {
            if (index > 0) {
                lines[index - 1].classList.remove('active');
            }
            if (index < lines.length) {
                lines[index].classList.add('active');
                lines[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                index++;
                setTimeout(highlightNextLine, 2000); // ganti waktu sesuai beat lagu
            }
        }

        highlightNextLine();
    </script>
</body>
</html>
